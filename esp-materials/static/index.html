<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Submarine RC</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#061018;color:#eef8f8}body{min-height:100vh;margin:0;display:grid;place-items:center}.card{width:min(480px,calc(100% - 40px));padding:28px;border:1px solid #29414f;border-radius:16px;background:#0d1c27}.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#39c8ac;box-shadow:0 0 10px #39c8ac}h1{font-size:22px;margin:10px 0}p{color:#aec1c9;line-height:1.55;margin:8px 0}.small{font-size:13px;color:#7893a1}code{color:#55d5ee}
    </style>
  </head>
  <body>
    <main class="card">
      <div><span class="dot"></span>ESP32 controller online</div>
      <h1>Open the Submarine RC app</h1>
      <p>The full controller UI is stored inside the Android app to keep this ESP32 focused on camera streaming and hardware control.</p>
      <p class="small">Controller API: <code>192.168.4.1</code> · Camera stream: port <code>81</code></p>
    </main>
  </body>
</html>
