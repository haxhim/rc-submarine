[platformio]
default_envs = esp32cam
data_dir = data

[env:esp32cam]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DBOARD_HAS_PSRAM
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  madhephaestus/ESP32Servo@^3.0.6
